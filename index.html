  :root { color-scheme: light; }

    } catch (e) { return initialValue; }
  });
  useEffect(() => {
    try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* noop */ }
  }, [key, value]);
  return [value, setValue];
}

   ALMACENAMIENTO COMPARTIDO — Firebase Firestore (tiempo real)
   ============================================================ */
const FIRESTORE_COLLECTION = 'mi-club-aletas';
const FIRESTORE_DOC = 'estado';
const FIRESTORE_RULES_SNIPPET = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /${FIRESTORE_COLLECTION}/{document=**} {
      allow read, write: if request.auth != null;
    }
  }
}`;

let _fbApp = null;
function connectFirebase(config) {
  const name = 'club-app-' + Date.now();
  _fbApp = firebase.initializeApp(config, name);
  return _fbApp.auth().signInAnonymously().then(() => _fbApp.firestore());
}

const SEED_STATE = {
  tasks: MOCK_TASKS, credentials: MOCK_CREDENTIALS, events: MOCK_EVENTS,
  directivos: INITIAL_DIRECTIVOS, templates: INITIAL_TEMPLATES,
};

function useCloudStore(config) {
  const [data, setData] = useState(null);
  const [status, setStatus] = useState('idle'); // idle | connecting | ready | error
  const [errorMsg, setErrorMsg] = useState('');
  const docRefRef = useRef(null);

  useEffect(() => {
    if (!config) { setStatus('idle'); return undefined; }
    let unsub = null;
    let cancelled = false;
    setStatus('connecting');
    setErrorMsg('');
    connectFirebase(config)
      .then((db) => {
        if (cancelled) return;
        const ref = db.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC);
        docRefRef.current = ref;
        return ref.get().then((snap) => (snap.exists ? null : ref.set(SEED_STATE)));
      })
      .then(() => {
        if (cancelled || !docRefRef.current) return;
        unsub = docRefRef.current.onSnapshot(
          (snap) => { if (!cancelled) { setData(snap.data() || {}); setStatus('ready'); } },
          (err) => { if (!cancelled) { setStatus('error'); setErrorMsg(err.message || String(err)); } }
        );
      })
      .catch((err) => { if (!cancelled) { setStatus('error'); setErrorMsg(err.message || String(err)); } });

    return () => { cancelled = true; if (unsub) unsub(); };
  }, [config]);

  const updateField = useCallback((field, value) => {
    setData((prev) => ({ ...(prev || {}), [field]: value }));
    if (docRefRef.current) docRefRef.current.set({ [field]: value }, { merge: true }).catch((e) => console.error('Error al guardar en Firestore:', e));
  }, []);

  return { data, status, errorMsg, updateField };
}

/* ---------- Helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 10);

function formatFechaLarga(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' });
}
function formatFechaCorta(iso) {
  if (!iso) return { dia: '', mes: '' };
  const [y, m, d] = iso.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  return {
    dia: date.toLocaleDateString('es-CO', { day: '2-digit' }),
    mes: date.toLocaleDateString('es-CO', { month: 'short' }).replace('.', ''),
  };
}
function isVencida(iso, estado) {
  if (estado === 'completado') return false;
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d) < hoy;
}
function pad2(n) { return String(n).padStart(2, '0'); }

function buildGoogleCalendarUrl(evt) {
  const [y, m, d] = evt.fecha.split('-').map(Number);
  const [hh, mm] = (evt.hora || '09:00').split(':').map(Number);
  const start = new Date(y, m - 1, d, hh, mm);
  const end = new Date(start.getTime() + 60 * 60 * 1000);
  const fmt = (dt) => `${dt.getFullYear()}${pad2(dt.getMonth() + 1)}${pad2(dt.getDate())}T${pad2(dt.getHours())}${pad2(dt.getMinutes())}00`;
  const params = new URLSearchParams({ action: 'TEMPLATE', text: evt.nombre, dates: `${fmt(start)}/${fmt(end)}`, details: evt.descripcion || '', location: evt.lugar || '' });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}
function downloadICS(evt) {
  const [y, m, d] = evt.fecha.split('-').map(Number);
  const [hh, mm] = (evt.hora || '09:00').split(':').map(Number);
  const start = new Date(y, m - 1, d, hh, mm);
  const end = new Date(start.getTime() + 60 * 60 * 1000);
  const fmt = (dt) => `${dt.getFullYear()}${pad2(dt.getMonth() + 1)}${pad2(dt.getDate())}T${pad2(dt.getHours())}${pad2(dt.getMinutes())}00`;
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Mi Club Aletas//ES', 'BEGIN:VEVENT',
    `UID:${uid()}@clubaletascopacabana`, `DTSTAMP:${fmt(new Date())}`, `DTSTART:${fmt(start)}`, `DTEND:${fmt(end)}`,
    `SUMMARY:${evt.nombre}`, `DESCRIPTION:${(evt.descripcion || '').replace(/\n/g, '\\n')}`, `LOCATION:${evt.lugar || ''}`,
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${evt.nombre.replace(/\s+/g, '_')}.ics`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function directivoById(directivos, id) { return directivos.find((d) => d.id === id) || null; }
function directivoNombre(directivos, id) {
  const d = directivoById(directivos, id);
  return d ? d.nombre : 'Sin asignar';
}

function StatCard({ label, value, icon, tone, onClick }) {
  const tones = { azul: { bg: C.azul, fg: '#fff' }, rojo: { bg: C.rojo, fg: '#fff' }, oscuro: { bg: C.azulOscuro, fg: '#fff' } };
  const t = tones[tone];
  return html`
    <button onClick=${onClick} class="text-left rounded-2xl p-5 transition-transform hover:-translate-y-0.5" style=${{ backgroundColor: t.bg }}>
      <div class="flex items-center justify-between">
        <span class="text-3xl font-extrabold" style=${{ color: t.fg }}>${value}</span>
        <${Icon} name=${icon} size=${20} color=${t.fg} style=${{ opacity: 0.85 }} />
      </div>
      <p class="text-xs font-semibold mt-2" style=${{ color: t.fg, opacity: 0.9 }}>${label}</p>
    </button>`;
}

function Dashboard({ tasks, events, directivos, onNavigate }) {
  const pendientes = tasks.filter((t) => t.estado === 'pendiente');
  const vencidas = pendientes.filter((t) => isVencida(t.fecha, t.estado));
  const proximosEventos = useMemo(() => {
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    return [...events].filter((e) => { const [y, m, d] = e.fecha.split('-').map(Number); return new Date(y, m - 1, d) >= hoy; })
      .sort((a, b) => a.fecha.localeCompare(b.fecha)).slice(0, 3);
  }, [events]);

  return html`
    <div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <${StatCard} label="Tareas pendientes" value=${pendientes.length} icon="clipboardlist" tone="azul" onClick=${() => onNavigate('tareas')} />
        <${StatCard} label="Vencidas" value=${vencidas.length} icon="alertcircle" tone="rojo" onClick=${() => onNavigate('tareas')} />
        <${StatCard} label="Próximos eventos" value=${proximosEventos.length} icon="calendar" tone="oscuro" onClick=${() => onNavigate('calendario')} />
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-5 gap-5">
        <${Card} className="lg:col-span-3">
          <div class="flex items-center justify-between mb-4">
            <div><${SectionEyebrow}>Agenda</${SectionEyebrow}><h3 class="font-bold text-base" style=${{ color: C.texto }}>Próximos 3 eventos</h3></div>
            <button onClick=${() => onNavigate('calendario')} class="text-xs font-bold flex items-center gap-1" style=${{ color: C.azul }}>Ver todos <${Icon} name="arrowupright" size=${14} /></button>
          </div>
          ${proximosEventos.length === 0
            ? html`<${EmptyState} icon="calendar" title="Sin eventos próximos" subtitle="Agrega una fecha importante desde el módulo de calendario." />`
            : html`<div class="space-y-2">
                ${proximosEventos.map((e) => {
                  const fc = formatFechaCorta(e.fecha);
                  return html`
                    <div key=${e.id} class="flex items-center gap-4 rounded-xl p-3" style=${{ backgroundColor: C.gris }}>
                      <div class="flex flex-col items-center justify-center rounded-lg w-14 h-14 shrink-0" style=${{ backgroundColor: C.azul }}>
                        <span class="text-white text-[10px] font-bold uppercase">${fc.mes}</span>
                        <span class="text-white text-lg font-extrabold leading-none">${fc.dia}</span>
                      </div>
                      <div class="min-w-0">
                        <p class="font-semibold text-sm truncate" style=${{ color: C.texto }}>${e.nombre}</p>
                        <p class="text-xs flex items-center gap-1 mt-0.5" style=${{ color: C.textoSuave }}>
                          <${Icon} name="clock" size=${12} /> ${e.hora} · <${Icon} name="mappin" size=${12} /> ${e.lugar}
                        </p>
                      </div>
                    </div>`;
                })}
              </div>`}
        </${Card}>

        <${Card} className="lg:col-span-2">
          <${SectionEyebrow}>Club</${SectionEyebrow}>
          <h3 class="font-bold text-base mb-4" style=${{ color: C.texto }}>Disciplinas deportivas</h3>
          <div class="space-y-3">
            ${DISCIPLINAS.map((d) => html`
              <div key=${d.id} class="flex items-start gap-3">
                <div class="rounded-lg p-2 shrink-0" style=${{ backgroundColor: `${d.color}1A` }}><${Icon} name=${d.icon} size=${16} color=${d.color} /></div>
                <div><p class="text-sm font-bold" style=${{ color: C.texto }}>${d.nombre}</p><p class="text-xs" style=${{ color: C.textoSuave }}>${d.detalle}</p></div>
              </div>`)}
          </div>
        </${Card}>
      </div>
    </div>`;
}

function TaskForm({ initial, directivos, onSave, onCancel }) {
  const [titulo, setTitulo] = useState(initial?.titulo || '');

  return html`
    <form onSubmit=${submit}>
      <${Field} label="Título / Descripción"><textarea class=${inputClass} rows="3" value=${titulo} onChange=${(e) => setTitulo(e.target.value)} placeholder="Ej. Solicitar espacio para entrenamiento" required /></${Field}>
      <div class="grid grid-cols-2 gap-3">
        <${Field} label="Categoría"><select class=${inputClass} value=${categoria} onChange=${(e) => setCategoria(e.target.value)}>${CATEGORIAS_TAREA.map((c) => html`<option key=${c} value=${c}>${c}</option>`)}</select></${Field}>
        <${Field} label="Fecha límite"><input type="date" class=${inputClass} value=${fecha} onChange=${(e) => setFecha(e.target.value)} required /></${Field}>

      <div class="flex justify-end gap-2 mt-2"><${Button} type="button" variant="ghost" onClick=${onCancel}>Cancelar</${Button}><${Button} type="submit">Guardar tarea</${Button}></div>
    </form>`;
}

function TaskManager({ tasks, setTasks, directivos }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editingTask, setEditingTask] = useState(null);
  const [filterResp, setFilterResp] = useState('todos');
  const [filterEstado, setFilterEstado] = useState('todos');

  const filtered = tasks.filter((t) => (filterResp === 'todos' || t.responsable === filterResp) && (filterEstado === 'todos' || t.estado === filterEstado))
    .sort((a, b) => a.fecha.localeCompare(b.fecha));

  const openNew = () => { setEditingTask(null); setModalOpen(true); };
  const openEdit = (t) => { setEditingTask(t); setModalOpen(true); };
  const saveTask = (data) => {
    if (editingTask) setTasks(tasks.map((t) => (t.id === editingTask.id ? { ...t, ...data } : t)));
    else setTasks([{ id: uid(), estado: 'pendiente', ...data }, ...tasks]);
    setModalOpen(false);
  };
  const toggleEstado = (id) => setTasks(tasks.map((t) => (t.id === id ? { ...t, estado: t.estado === 'pendiente' ? 'completado' : 'pendiente' } : t)));
  const deleteTask = (id) => setTasks(tasks.filter((t) => t.id !== id));

  return html`
    <div>
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
        <div class="flex flex-wrap items-center gap-2">
          <${FilterSelect} icon="users" value=${filterResp} onChange=${setFilterResp}>
            <option value="todos">Todos los responsables</option>
            ${directivos.map((d) => html`<option key=${d.id} value=${d.id}>${d.nombre}</option>`)}
          </${FilterSelect}>
          <${FilterSelect} icon="filter" value=${filterEstado} onChange=${setFilterEstado}>
            <option value="todos">Todos los estados</option><option value="pendiente">Pendiente</option><option value="completado">Completado</option>
          </${FilterSelect}>
        </div>
        <${Button} onClick=${openNew}><${Icon} name="plus" size=${16} /> Nueva tarea</${Button}>
      </div>
      ${filtered.length === 0
        ? html`<${Card}><${EmptyState} icon="checksquare" title="No hay tareas con estos filtros" subtitle="Crea una nueva tarea o ajusta los filtros de responsable y estado." /></${Card}>`
        : html`<div class="space-y-2.5">${filtered.map((t) => html`<${TaskRow} key=${t.id} task=${t} directivos=${directivos} onToggle=${toggleEstado} onEdit=${openEdit} onDelete=${deleteTask} />`)}</div>`}
      <${Modal} open=${modalOpen} onClose=${() => setModalOpen(false)} title=${editingTask ? 'Editar tarea' : 'Nueva tarea'}>
        <${TaskForm} initial=${editingTask} directivos=${directivos} onSave=${saveTask} onCancel=${() => setModalOpen(false)} />
      </${Modal}>
    </div>`;
}

function CredentialsVault({ credentials, setCredentials }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [visible, setVisible] = useState({});
  const [copiedId, setCopiedId] = useState(null);

  const openNew = () => { setEditing(null); setModalOpen(true); };
  const openEdit = (c) => { setEditing(c); setModalOpen(true); };
  const save = (data) => {
    if (editing) setCredentials(credentials.map((c) => (c.id === editing.id ? { ...c, ...data } : c)));
    else setCredentials([{ id: uid(), ...data }, ...credentials]);
    setModalOpen(false);
  };
  const remove = (id) => setCredentials(credentials.filter((c) => c.id !== id));
  const toggleVisible = (id) => setVisible((v) => ({ ...v, [id]: !v[id] }));
  const copy = async (id, text) => {
    try { await navigator.clipboard.writeText(text); setCopiedId(id); setTimeout(() => setCopiedId(null), 1500); } catch (e) { /* noop */ }
  };

  return html`
    <div>
      <div class="flex items-center justify-between mb-5 gap-3">
        <p class="text-xs" style=${{ color: C.textoSuave }}>Accesos a redes sociales y plataformas del club. Visible para toda la mesa directiva.</p>
        <${Button} onClick=${openNew}><${Icon} name="plus" size=${16} /> Nuevo acceso</${Button}>
      </div>
      ${credentials.length === 0
        ? html`<${Card}><${EmptyState} icon="key" title="Aún no hay accesos guardados" subtitle="Agrega tu primera credencial de red social o plataforma web." /></${Card}>`
        : html`<${Card} padded=${false} className="overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead><tr style=${{ backgroundColor: C.gris }}>${['Plataforma', 'Usuario', 'Contraseña', 'Notas', ''].map((h) => html`<th key=${h} class="text-left px-4 py-3 text-xs font-bold uppercase tracking-wide" style=${{ color: C.textoSuave }}>${h}</th>`)}</tr></thead>
                <tbody>
                  ${credentials.map((c) => {
                    const shown = !!visible[c.id];
                    return html`
                      <tr key=${c.id} style=${{ borderTop: `1px solid ${C.borde}` }}>
                        <td class="px-4 py-3"><div class="flex items-center gap-2.5"><div class="rounded-lg p-1.5" style=${{ backgroundColor: C.azulSuave }}><${Icon} name=${c.icon || 'globe'} size=${15} color=${C.azul} /></div><span class="font-semibold" style=${{ color: C.texto }}>${c.plataforma}</span></div></td>
                        <td class="px-4 py-3" style=${{ color: C.textoSuave }}>${c.usuario}</td>
                        <td class="px-4 py-3"><div class="flex items-center gap-2 font-mono text-xs">
                          <span>${shown ? c.password : '•'.repeat(Math.max(6, c.password.length))}</span>
                          <${IconButton} icon=${shown ? 'eyeoff' : 'eye'} onClick=${() => toggleVisible(c.id)} size=${15} />
                          <${IconButton} icon=${copiedId === c.id ? 'check' : 'copy'} tone=${copiedId === c.id ? '#1E7A3D' : C.textoSuave} onClick=${() => copy(c.id, c.password)} size=${15} />
                        </div></td>
                        <td class="px-4 py-3 max-w-[180px] truncate" style=${{ color: C.textoSuave }}>${c.notas || '—'}</td>
                        <td class="px-4 py-3"><div class="flex items-center gap-1 justify-end"><${IconButton} icon="pencil" onClick=${() => openEdit(c)} size=${15} /><${IconButton} icon="trash" tone=${C.rojo} onClick=${() => remove(c.id)} size=${15} /></div></td>
                      </tr>`;
                  })}
                </tbody>
              </table>
            </div>
          </${Card}>`}
      <${Modal} open=${modalOpen} onClose=${() => setModalOpen(false)} title=${editing ? 'Editar acceso' : 'Nuevo acceso'}>
        <${CredentialForm} initial=${editing} onSave=${save} onCancel=${() => setModalOpen(false)} />
      </${Modal}>
    </div>`;
}

        <${Field} label="Fecha"><input type="date" class=${inputClass} value=${fecha} onChange=${(e) => setFecha(e.target.value)} /></${Field}>
        <${Field} label="Cuerpo del mensaje">
          <textarea class=${inputClass} rows="7" value=${cuerpo} onChange=${(e) => setCuerpo(e.target.value)} placeholder="Escribe el contenido de la carta..." />
        </${Field}>
        <button type="button" onClick=${restablecerPlantilla} class="text-xs font-bold mb-4" style=${{ color: C.azul }}>Restablecer texto de la plantilla</button>
        <${Field} label="Firma digital">
          <select class=${inputClass} value=${firmanteId} onChange=${(e) => setFirmanteId(e.target.value)}>${directivos.map((d) => html`<option key=${d.id} value=${d.id}>${d.nombre} — ${d.cargo}</option>`)}</select>
        </${Field}>
        <${Button} onClick=${handlePrint} className="w-full mt-1"><${Icon} name="printer" size=${16} /> Imprimir / Guardar en PDF</${Button}>
      </${Card}>

      <div>
        <${SectionEyebrow}>Vista previa</${SectionEyebrow}>
        <h3 class="font-bold text-base mb-4 no-print" style=${{ color: C.texto }}>Documento con membrete</h3>
        <div id="document-preview" class="rounded-2xl bg-white overflow-hidden" style=${{ border: `1px solid ${C.borde}`, boxShadow: '0 1px 2px rgba(17,17,17,0.04)' }}>
          <${LetterheadPreview} tipoObj=${tipoObj} destinatario=${destinatario} cedula=${cedula} asunto=${asunto} fecha=${fecha} cuerpo=${cuerpo} firmante=${firmante} acudiente=${acudiente} cedulaAcudiente=${cedulaAcudiente} parentesco=${parentesco} />
        </div>
      </div>
    </div>`;
}

/* ---------- MÓDULO — FECHAS IMPORTANTES ---------- */
function EventForm({ initial, onSave, onCancel }) {
  const [nombre, setNombre] = useState(initial?.nombre || '');
  const [fecha, setFecha] = useState(initial?.fecha || '');
  const [hora, setHora] = useState(initial?.hora || '09:00');
  const [lugar, setLugar] = useState(initial?.lugar || '');
  const [descripcion, setDescripcion] = useState(initial?.descripcion || '');
  const submit = (e) => { e.preventDefault(); if (!nombre.trim() || !fecha) return; onSave({ nombre: nombre.trim(), fecha, hora, lugar: lugar.trim(), descripcion: descripcion.trim() }); };
  return html`
    <form onSubmit=${submit}>
      <${Field} label="Nombre del evento"><input class=${inputClass} value=${nombre} onChange=${(e) => setNombre(e.target.value)} placeholder="Ej. Torneo interclubes" required /></${Field}>
      <div class="grid grid-cols-2 gap-3">
        <${Field} label="Fecha"><input type="date" class=${inputClass} value=${fecha} onChange=${(e) => setFecha(e.target.value)} required /></${Field}>
        <${Field} label="Hora"><input type="time" class=${inputClass} value=${hora} onChange=${(e) => setHora(e.target.value)} /></${Field}>
      </div>
      <${Field} label="Lugar"><input class=${inputClass} value=${lugar} onChange=${(e) => setLugar(e.target.value)} placeholder="Ej. Piscina Olímpica Copacabana" /></${Field}>
      <${Field} label="Descripción"><textarea class=${inputClass} rows="3" value=${descripcion} onChange=${(e) => setDescripcion(e.target.value)} placeholder="Detalles del evento" /></${Field}>
      <div class="flex justify-end gap-2 mt-2"><${Button} type="button" variant="ghost" onClick=${onCancel}>Cancelar</${Button}><${Button} type="submit">Guardar evento</${Button}></div>
    </form>`;
}

function EventCard({ evt, onEdit, onDelete }) {
  const fc = formatFechaCorta(evt.fecha);
  return html`
    <${Card} className="flex flex-col">
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="flex flex-col items-center justify-center rounded-xl w-14 h-14 shrink-0" style=${{ backgroundColor: C.azul }}>
            <span class="text-white text-[10px] font-bold uppercase">${fc.mes}</span><span class="text-white text-lg font-extrabold leading-none">${fc.dia}</span>
          </div>
          <div><p class="font-bold text-sm" style=${{ color: C.texto }}>${evt.nombre}</p><p class="text-xs flex items-center gap-1 mt-0.5" style=${{ color: C.textoSuave }}><${Icon} name="clock" size=${12} /> ${evt.hora}</p></div>
        </div>
        <div class="flex items-center gap-1 shrink-0"><${IconButton} icon="pencil" onClick=${() => onEdit(evt)} size=${15} /><${IconButton} icon="trash" tone=${C.rojo} onClick=${() => onDelete(evt.id)} size=${15} /></div>
      </div>
      <p class="text-xs flex items-center gap-1 mt-3" style=${{ color: C.textoSuave }}><${Icon} name="mappin" size=${12} /> ${evt.lugar}</p>
      ${evt.descripcion && html`<p class="text-xs mt-1.5" style=${{ color: C.textoSuave }}>${evt.descripcion}</p>`}
      <div class="flex items-center gap-2 mt-4">
        <a href=${buildGoogleCalendarUrl(evt)} target="_blank" rel="noopener noreferrer" class="flex-1 inline-flex items-center justify-center gap-1.5 rounded-lg px-3 py-2 text-xs font-bold" style=${{ backgroundColor: C.azulSuave, color: C.azul }}><${Icon} name="calendar" size=${14} /> Agendar en Google</a>
        <button onClick=${() => downloadICS(evt)} class="inline-flex items-center justify-center gap-1.5 rounded-lg px-3 py-2 text-xs font-bold" style=${{ backgroundColor: C.gris, color: C.texto }}><${Icon} name="download" size=${14} /> .ics</button>
      </div>
    </${Card}>`;
}

function EventsCalendar({ events, setEvents }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const sorted = [...events].sort((a, b) => a.fecha.localeCompare(b.fecha));
  const openNew = () => { setEditing(null); setModalOpen(true); };
  const openEdit = (e) => { setEditing(e); setModalOpen(true); };
  const save = (data) => { if (editing) setEvents(events.map((e) => (e.id === editing.id ? { ...e, ...data } : e))); else setEvents([{ id: uid(), ...data }, ...events]); setModalOpen(false); };
  const remove = (id) => setEvents(events.filter((e) => e.id !== id));
  return html`
    <div>
      <div class="flex items-center justify-between mb-5 gap-3">
        <p class="text-xs" style=${{ color: C.textoSuave }}>Torneos, reuniones de junta, entrenamientos especiales y entregas de reportes.</p>
        <${Button} onClick=${openNew}><${Icon} name="plus" size=${16} /> Nuevo evento</${Button}>
      </div>
      ${sorted.length === 0
        ? html`<${Card}><${EmptyState} icon="calendar" title="No hay fechas registradas" subtitle="Agrega el primer evento del club." /></${Card}>`
        : html`<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${sorted.map((e) => html`<${EventCard} key=${e.id} evt=${e} onEdit=${openEdit} onDelete=${remove} />`)}</div>`}
      <${Modal} open=${modalOpen} onClose=${() => setModalOpen(false)} title=${editing ? 'Editar evento' : 'Nuevo evento'}>
        <${EventForm} initial=${editing} onSave=${save} onCancel=${() => setModalOpen(false)} />
      </${Modal}>
    </div>`;
}

/* ---------- MÓDULO — CONFIGURACIÓN ---------- */
function DirectivoForm({ initial, onSave, onCancel }) {
  const [nombre, setNombre] = useState(initial?.nombre || '');
  const [cargo, setCargo] = useState(initial?.cargo || '');
  const [firmaPng, setFirmaPng] = useState(initial?.firmaPng || null);
  const fileRef = useRef(null);

  const handleFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const base64 = await fileToBase64(file);
    setFirmaPng(base64);
  };
  const submit = (e) => { e.preventDefault(); if (!nombre.trim() || !cargo.trim()) return; onSave({ nombre: nombre.trim(), cargo: cargo.trim(), firmaPng }); };

  return html`
    <form onSubmit=${submit}>
      <${Field} label="Nombre completo"><input class=${inputClass} value=${nombre} onChange=${(e) => setNombre(e.target.value)} required /></${Field}>
      <${Field} label="Cargo"><input class=${inputClass} value=${cargo} onChange=${(e) => setCargo(e.target.value)} placeholder="Presidente, Secretario..." required /></${Field}>
      <${Field} label="Firma (imagen PNG)">
        <div class="flex items-center gap-3">
          <div class="rounded-xl flex items-center justify-center shrink-0" style=${{ width: 100, height: 56, backgroundColor: C.gris, border: `1px dashed ${C.borde}` }}>
            ${firmaPng ? html`<img src=${firmaPng} style=${{ maxHeight: 48, maxWidth: 92, objectFit: 'contain' }} />` : html`<${Icon} name="image" size=${18} color=${C.textoSuave} />`}
          </div>
          <div class="flex flex-col gap-1.5">
            <button type="button" onClick=${() => fileRef.current && fileRef.current.click()} class="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-bold" style=${{ backgroundColor: C.azulSuave, color: C.azul }}><${Icon} name="upload" size=${13} /> Subir firma</button>
            ${firmaPng && html`<button type="button" onClick=${() => setFirmaPng(null)} class="text-xs font-bold text-left" style=${{ color: C.rojo }}>Quitar firma</button>`}
          </div>
          <input ref=${fileRef} type="file" accept="image/png,image/jpeg" class="hidden" onChange=${handleFile} />
        </div>
      </${Field}>
      <div class="flex justify-end gap-2 mt-2"><${Button} type="button" variant="ghost" onClick=${onCancel}>Cancelar</${Button}><${Button} type="submit">Guardar</${Button}></div>
    </form>`;
}

function SettingsEquipo({ directivos, setDirectivos }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const openNew = () => { setEditing(null); setModalOpen(true); };
  const openEdit = (d) => { setEditing(d); setModalOpen(true); };
  const save = (data) => {
    if (editing) setDirectivos(directivos.map((d) => (d.id === editing.id ? { ...d, ...data } : d)));
    else setDirectivos([...directivos, { id: uid(), ...data }]);
    setModalOpen(false);
  };
  const remove = (id) => { if (window.confirm('¿Eliminar este integrante de la mesa directiva?')) setDirectivos(directivos.filter((d) => d.id !== id)); };

  return html`
    <div>
      <div class="flex items-center justify-between mb-4">
        <p class="text-xs" style=${{ color: C.textoSuave }}>Nombres, cargos y firmas digitales usadas en los documentos generados.</p>
        <${Button} onClick=${openNew}><${Icon} name="plus" size=${16} /> Agregar integrante</${Button}>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        ${directivos.map((d) => html`
          <${Card} key=${d.id} className="flex items-center gap-3">
            <div class="rounded-xl flex items-center justify-center shrink-0" style=${{ width: 56, height: 56, backgroundColor: C.azulSuave }}>
              ${d.firmaPng ? html`<img src=${d.firmaPng} style=${{ maxHeight: 44, maxWidth: 50, objectFit: 'contain' }} />` : html`<${Icon} name="users" size=${20} color=${C.azul} />`}
            </div>
            <div class="min-w-0 flex-1"><p class="font-bold text-sm truncate" style=${{ color: C.texto }}>${d.nombre}</p><p class="text-xs" style=${{ color: C.textoSuave }}>${d.cargo}</p></div>
            <div class="flex items-center gap-1 shrink-0"><${IconButton} icon="pencil" onClick=${() => openEdit(d)} size=${15} /><${IconButton} icon="trash" tone=${C.rojo} onClick=${() => remove(d.id)} size=${15} /></div>
          </${Card}>`)}
      </div>
      <${Modal} open=${modalOpen} onClose=${() => setModalOpen(false)} title=${editing ? 'Editar integrante' : 'Agregar integrante'}>
        <${DirectivoForm} initial=${editing} onSave=${save} onCancel=${() => setModalOpen(false)} />
      </${Modal}>
    </div>`;
}

function PlantillaCard({ tpl, onSave, onDelete }) {
  const [label, setLabel] = useState(tpl.label);
  const [asunto, setAsunto] = useState(tpl.asunto);
  const [cuerpo, setCuerpo] = useState(tpl.cuerpo);
  const [esMenor, setEsMenor] = useState(tpl.esMenor);
  const [saved, setSaved] = useState(false);
  const guardar = () => { onSave({ ...tpl, label, asunto, cuerpo, esMenor }); setSaved(true); setTimeout(() => setSaved(false), 1200); };
  return html`
    <${Card}>
      <div class="flex items-center justify-between gap-3 mb-3">
        <input class="${inputClass} font-bold" style=${{ border: 'none', padding: '2px 0', fontSize: 15 }} value=${label} onChange=${(e) => setLabel(e.target.value)} />
        <${IconButton} icon="trash" tone=${C.rojo} onClick=${() => onDelete(tpl.id)} size=${15} />
      </div>
      <${Field} label="Asunto por defecto"><input class=${inputClass} value=${asunto} onChange=${(e) => setAsunto(e.target.value)} /></${Field}>
      <${Field} label="Cuerpo por defecto"><textarea class=${inputClass} rows="6" value=${cuerpo} onChange=${(e) => setCuerpo(e.target.value)} /></${Field}>
      <label class="flex items-center gap-2 mb-4 text-xs font-semibold" style=${{ color: C.texto }}>
        <input type="checkbox" checked=${esMenor} onChange=${(e) => setEsMenor(e.target.checked)} /> Incluye datos de menor de edad y acudiente
      </label>
      <${Button} size="sm" onClick=${guardar}><${Icon} name=${saved ? 'check' : 'save'} size=${14} /> ${saved ? 'Guardado' : 'Guardar cambios'}</${Button}>
    </${Card}>`;
}

function SettingsPlantillas({ templates, setTemplates }) {
  const addTemplate = () => setTemplates([...templates, { id: uid(), label: 'Nuevo tipo de documento', asunto: '', cuerpo: '', esMenor: false }]);
  const saveTemplate = (data) => setTemplates(templates.map((t) => (t.id === data.id ? data : t)));
  const deleteTemplate = (id) => { if (templates.length <= 1) return; if (window.confirm('¿Eliminar este tipo de documento?')) setTemplates(templates.filter((t) => t.id !== id)); };
  return html`
    <div>
      <div class="flex items-center justify-between mb-4">
        <p class="text-xs" style=${{ color: C.textoSuave }}>Mensaje base con el que se precarga cada tipo de documento en el generador de cartas.</p>
        <${Button} onClick=${addTemplate}><${Icon} name="plus" size=${16} /> Nuevo tipo</${Button}>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">${templates.map((t) => html`<${PlantillaCard} key=${t.id} tpl=${t} onSave=${saveTemplate} onDelete=${deleteTemplate} />`)}</div>
    </div>`;
}

function Settings({ directivos, setDirectivos, templates, setTemplates }) {
  const [tab, setTab] = useState('equipo');
  return html`
    <div>
      <div class="flex flex-wrap gap-2 mb-5">
        ${[['equipo', 'Mesa Directiva'], ['plantillas', 'Plantillas de Documentos'], ['conexion', 'Base de Datos']].map(([id, label]) => html`
          <button key=${id} onClick=${() => setTab(id)} class="rounded-xl px-4 py-2 text-sm font-bold transition-colors"
            style=${{ backgroundColor: tab === id ? C.azul : C.gris, color: tab === id ? '#fff' : C.textoSuave }}>${label}</button>`)}
      </div>
      ${tab === 'equipo' && html`<${SettingsEquipo} directivos=${directivos} setDirectivos=${setDirectivos} />`}
      ${tab === 'plantillas' && html`<${SettingsPlantillas} templates=${templates} setTemplates=${setTemplates} />`}
      ${tab === 'conexion' && html`<${SettingsConexion} />`}
    </div>`;
}

function ConfigMissingScreen() {
  return html`
    <div class="min-h-screen flex items-center justify-center p-6" style=${{ backgroundColor: C.gris }}>
      <${Card} className="max-w-lg">
        <div class="flex items-center gap-3 mb-4"><${ClubMark} size=${40} /><h2 class="font-bold text-base" style=${{ color: C.texto }}>Falta configurar Firebase</h2></div>
        <p class="text-sm mb-3" style=${{ color: C.texto }}>Este despliegue todavía no tiene la configuración del proyecto compartido. Abre el archivo fuente y reemplaza la constante <code class="font-mono text-xs px-1 py-0.5 rounded" style=${{ backgroundColor: C.gris }}>FIREBASE_CONFIG</code> con los valores de tu proyecto de Firebase (Configuración del proyecto → Tus apps → objeto <code class="font-mono text-xs px-1 py-0.5 rounded" style=${{ backgroundColor: C.gris }}>firebaseConfig</code>), y vuelve a desplegar.</p>
        <p class="text-xs" style=${{ color: C.textoSuave }}>Reglas de Firestore necesarias:</p>
        <pre class="rounded-lg p-3 text-[11px] overflow-x-auto mt-1" style=${{ backgroundColor: C.azulOscuro, color: '#E5EAF7' }}>${FIRESTORE_RULES_SNIPPET}</pre>
      </${Card}>
    </div>`;
}

function ConnectingScreen({ label }) {
  return html`
    <div class="min-h-screen flex items-center justify-center" style=${{ backgroundColor: C.gris }}>
      <div class="flex flex-col items-center gap-3">
        <${ClubMark} size=${48} />
        <p class="text-sm font-semibold" style=${{ color: C.textoSuave }}>${label}</p>
      </div>
    </div>`;
}

function ErrorScreen({ message }) {
  return html`
    <div class="min-h-screen flex items-center justify-center p-6" style=${{ backgroundColor: C.gris }}>
      <${Card} className="max-w-md text-center">
        <div class="mx-auto mb-3 rounded-2xl p-3 w-fit" style=${{ backgroundColor: C.rojoSuave }}><${Icon} name="alertcircle" size=${24} color=${C.rojo} /></div>
        <p class="font-bold text-sm mb-1" style=${{ color: C.texto }}>No se pudo conectar a la base de datos compartida</p>
        <p class="text-xs mb-4" style=${{ color: C.textoSuave }}>${message}</p>
        <p class="text-xs" style=${{ color: C.textoSuave }}>Verifica tu conexión a internet y vuelve a intentar recargando la página.</p>
      </${Card}>
    </div>`;
}

function SettingsConexion() {
  const [copied, setCopied] = useState(false);
  const copyRules = async () => { try { await navigator.clipboard.writeText(FIRESTORE_RULES_SNIPPET); setCopied(true); setTimeout(() => setCopied(false), 1500); } catch (e) { /* noop */ } };
  return html`
    <div class="max-w-xl">
      <${Card} className="mb-4">
        <${SectionEyebrow}>Estado</${SectionEyebrow}>
        <h3 class="font-bold text-base mb-3" style=${{ color: C.texto }}>Datos compartidos en tiempo real</h3>
        <p class="text-xs mb-4" style=${{ color: C.textoSuave }}>Proyecto conectado: <b>${FIREBASE_CONFIG.projectId}</b>. Todos los directivos que abran este mismo link ven y editan los mismos datos en tiempo real, sin configurar nada.</p>
        <${Button} size="sm" variant="ghost" onClick=${copyRules}><${Icon} name="copy" size=${13} /> ${copied ? 'Reglas copiadas ✓' : 'Copiar reglas de seguridad'}</${Button}>
      </${Card}>
    </div>`;
}

/* ---------- APP RAÍZ ---------- */
const TITLES = {
  dashboard: { title: 'Inicio', subtitle: 'Resumen general de la mesa directiva' },
  tareas: { title: 'Gestión de Pendientes', subtitle: 'Tareas y responsabilidades de la mesa directiva' },
  boveda: { title: 'Bóveda de Accesos', subtitle: 'Credenciales de redes sociales y plataformas del club' },
  documentos: { title: 'Cartas y Documentos', subtitle: 'Genera comunicaciones oficiales con el membrete del club' },
  calendario: { title: 'Fechas Importantes', subtitle: 'Torneos, reuniones, entrenamientos y entregas' },
  config: { title: 'Configuración', subtitle: 'Mesa directiva y plantillas de documentos' },
};

function App() {
  const [active, setActive] = useState('dashboard');
  const [mobileOpen, setMobileOpen] = useState(false);

  const configReady = FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'PENDIENTE';
  const cloud = useCloudStore(configReady ? FIREBASE_CONFIG : null);

  if (!configReady) return html`<${ConfigMissingScreen} />`;
  if (cloud.status === 'connecting' || cloud.status === 'idle') {
    return html`<${ConnectingScreen} label="Conectando con la base de datos compartida…" />`;
  }
  if (cloud.status === 'error') {
    return html`<${ErrorScreen} message=${cloud.errorMsg} />`;
  }
  if (!cloud.data) {
    return html`<${ConnectingScreen} label="Cargando información del club…" />`;
  }

  const data = cloud.data;
  const tasks = data.tasks || [];
  const credentials = data.credentials || [];
  const events = data.events || [];
  const directivos = data.directivos || [];
  const templates = data.templates || [];

  const setTasks = (v) => cloud.updateField('tasks', v);
  const setCredentials = (v) => cloud.updateField('credentials', v);
  const setEvents = (v) => cloud.updateField('events', v);
  const setDirectivos = (v) => cloud.updateField('directivos', v);
  const setTemplates = (v) => cloud.updateField('templates', v);

  const meta = TITLES[active];

  return html`
    <div class="min-h-screen flex" style=${{ backgroundColor: C.gris, fontFamily: 'ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif' }}>
      <${Sidebar} active=${active} onNavigate=${setActive} mobileOpen=${mobileOpen} setMobileOpen=${setMobileOpen} />
      <main class="flex-1 min-w-0 px-5 py-6 sm:px-8 sm:py-8 max-w-6xl mx-auto w-full">
        <${TopHeader} title=${meta.title} subtitle=${meta.subtitle} onMenuClick=${() => setMobileOpen(true)} />
        ${active === 'dashboard' && html`<${Dashboard} tasks=${tasks} events=${events} directivos=${directivos} onNavigate=${setActive} />`}
        ${active === 'tareas' && html`<${TaskManager} tasks=${tasks} setTasks=${setTasks} directivos=${directivos} />`}
        ${active === 'boveda' && html`<${CredentialsVault} credentials=${credentials} setCredentials=${setCredentials} />`}
        ${active === 'documentos' && html`<${DocumentGenerator} directivos=${directivos} templates=${templates} />`}
        ${active === 'calendario' && html`<${EventsCalendar} events=${events} setEvents=${setEvents} />`}
        ${active === 'config' && html`<${Settings} directivos=${directivos} setDirectivos=${setDirectivos} templates=${templates} setTemplates=${setTemplates} />`}
      </main>
    </div>`;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(html`<${App} />`);

</script>
<script>
  document.getElementById('favicon-link').setAttribute('href', LOGO_B64);
  document.getElementById('touch-icon-link').setAttribute('href', LOGO_B64);
</script>
